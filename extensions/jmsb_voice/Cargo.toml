[package]
name = "jmsb_voice"
version = "0.1.0"
edition = "2021"
description = "JMSB voice: the Arma 3 extension that carries radio voice over LiveKit (docs/DESIGN_VOICE_LIVEKIT.md)"
license = "MIT"
publish = false

[lib]
name = "jmsb_voice"
crate-type = ["cdylib", "rlib"]

# "client" is the audio side: joining rooms, the microphone, the mixer. Without
# it the extension only signs tokens - the Linux server build
# (jmsb_voice_x64.so), which needs no audio libraries.
[features]
default = ["client"]
client = [
    "dep:livekit-protocol", "dep:webrtc", "dep:rtc", "dep:async-trait", "dep:prost", "dep:opus",
    "dep:nnnoiseless", "dep:tokio-rustls", "dep:rustls-platform-verifier", "dep:tokio-tungstenite",
    "dep:serde_json", "dep:ring", "dep:rcgen", "dep:cpal", "dep:tokio", "dep:futures-util", "dep:windows",
]

[[bin]]
name = "voicetest"
required-features = ["client"]

# The DLL's file properties (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
# THE VOICE SERVERS WITHOUT LIBWEBRTC (2026-11-01): Google's WebRTC library
# was what antivirus flagged (its key-press check, its screen-capture glue).
# LiveKit now runs over webrtc-rs (pure Rust) with LiveKit's own protocol
# messages; Mumble over its TCP protocol with rustls. Opus is libopus (built
# by cmake: Visual Studio's own, or GitHub's), the noise suppression RNNoise
# in pure Rust.
livekit-api = { version = "=0.9.0", default-features = false, features = ["access-token"] }
livekit-protocol = { version = "=0.8.1", optional = true }
webrtc = { version = "0.21.1", optional = true }
# webrtc's sans-IO core, for the types its API takes (tracks, codecs, RTP);
# the same version webrtc is built on. Its crypto is ring (webrtc's default).
rtc = { version = "=0.21.1", default-features = false, optional = true }
# webrtc's event handler trait is an async_trait.
async-trait = { version = "0.1", optional = true }
# LiveKit's signal: a WebSocket (TLS by tokio-rustls, below; no native-tls),
# its ICE candidates JSON, and wss:// certificates checked by Windows' own
# verifier (rustls-platform-verifier: the system's roots, pure Rust).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }
serde_json = { version = "1", optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
prost = { version = "0.14", optional = true }
opus = { version = "0.4", optional = true }
nnnoiseless = { version = "0.5", default-features = false, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
ring = { version = "0.17", optional = true }
# Mumble lets only a client with a certificate make a channel: one is made at
# each connect (self-signed, ring; already in the tree through webrtc).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"], optional = true }
arma-rs = "1.13"
cpal = { version = "0.18", optional = true }
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"], optional = true }
futures-util = { version = "0.3", optional = true }
# "std" for the file logger (set_boxed_logger)
log = { version = "0.4", features = ["std"] }

# Windows' default COMMUNICATIONS device - the headset, where the default
# device is the monitor (user, 2026-10-31) - which cpal cannot ask for. The
# same windows crate and features cpal 0.18 builds with, so nothing extra.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Devices_Properties",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
