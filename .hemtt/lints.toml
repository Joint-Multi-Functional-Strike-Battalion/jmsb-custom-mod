[sqf.command_case]
severity = "Warning"
options.ignore = [
    "AGLtoASL",
    "ASLtoAGL",
    "WEST",
    "EAST",
    "INDEPENDENT",
    "RESISTANCE",
    "CIVILIAN",
    "getVehicleTiPars",
    "setVehicleTiPars",
]

[sqf.banned_commands]
options.ignore = [
    "addPublicVariableEventHandler", # Alternate syntax doesn't work, used in markers post init
]

[sqf.banned_macros]
options.release = [
    "DISABLE_COMPILE_CACHE", "ENABLE_PERFORMANCE_COUNTERS" #"DEBUG_MODE_FULL", 
]
[sqf.undefined]
enabled = true
options.check_orphan_code = true

[sqf.unused]
enabled = true #many false positives without DEBUG_MODE_FULL
options.check_params = false

[sqf.shadowed]
enabled = false

[sqf.not_private]
enabled = true

[sqf.short_circuit_bool_var]
enabled = true

[sqf.count_array_comp]
enabled = false

[config.config_this_call]
enabled = true

[config.file_type]
options.allow_no_extension = true

[stringtables.usage]
options.ignore_unused = true

[sqf]
enabled = true

[sqf.var_all_caps]
enabled = true
options.ignore = [
    "ACE_RECOMPILE", "ACE_RECOMPILES", "ACE_PFH_COUNTER"
]
