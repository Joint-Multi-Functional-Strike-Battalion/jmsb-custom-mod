// Binarize wants to know the model exists even when it has no skeleton and no
// sections - a rigid item is exactly that. Named after the p3d.
class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };
    class mpu5: Default {};
    class tw950: Default {};
};
